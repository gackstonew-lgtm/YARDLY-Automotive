    <!-- Open Graph & Social Sharing -->

    <!-- PWA Web App Manifest & iOS Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Early Theme & Status Bar Detection (Anti-Flicker) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('yardly_theme');
          var isDark = stored === 'dark' || (stored === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var statusColor = isDark ? '#000000' : '#FFFFFF';
          var statusBarStyle = isDark ? 'black' : 'default';

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }

          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', statusColor);
          }
          var metaAppleStatusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (metaAppleStatusBar) {
            metaAppleStatusBar.setAttribute('content', statusBarStyle);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F8F6] dark:bg-[#050505] text-[#0F241C] dark:text-[#F2F7F3] antialiased selection:bg-[#0251B8] selection:text-white dark:selection:bg-[#2D7DFF] dark:selection:text-[#050505] min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
