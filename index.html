<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Yardly Automotives | Your Automotive Journey Starts Here</title>
    <meta name="description" content="Yardly Automotives brings vehicle buying, selling, importation, trade-ins, auctions, car hire, spares, accessories, tracking and dealership marketing together in one convenient automotive platform." />
    
    <!-- Open Graph & Social Sharing -->
    <meta property="og:title" content="Yardly Automotives | Your Automotive Journey Starts Here" />
    <meta property="og:description" content="Yardly Automotives brings vehicle buying, selling, importation, trade-ins, auctions, car hire, spares, accessories, tracking and dealership marketing together in one convenient automotive platform." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.jpeg" />
    <meta property="og:site_name" content="Yardly Automotives" />
    
    <!-- PWA Web App Manifest & iOS Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00E878" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yardly Automotives" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Early Theme Detection (Anti-Flicker) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('yardly_theme');
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark || !stored) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F8F6] dark:bg-[#001A13] text-[#0F241C] dark:text-[#F2F7F3] antialiased selection:bg-[#00E878] selection:text-[#001A13] min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
